name: Browser tests

# Runs a portal's tests marked `e2e` in the FairDM development image with Chromium, against a
# PostGIS service. The image and PostGIS versions come from the FairDM the portal pins, as in
# tests.yml. Call it only from a portal that has browser tests: with none, pytest selects nothing
# and the check fails.

on:
  workflow_call:
    inputs:
      working-directory:
        description: The portal's directory within the repository. Portals leave it unset.
        type: string
        default: "."
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
      postgis: ${{ steps.read.outputs.postgis }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the platform the portal's FairDM declares
        id: read
        working-directory: ${{ inputs.working-directory }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import re
          import sys
          import tomllib
          import urllib.request

          with open("uv.lock", "rb") as lock:
              packages = tomllib.load(lock).get("package", [])
          fairdm = next((p for p in packages if p["name"] == "fairdm"), None)
          if fairdm is None:
              sys.exit("uv.lock has no fairdm package, so there is no platform to read.")
          source = fairdm["source"]
          if "git" in source:
              pin = re.fullmatch(
                  r"https://github\.com/([\w.-]+/[\w.-]+?)(?:\.git)?(?:\?[^#]*)?#([0-9a-f]{40})",
                  source["git"],
              )
              if pin is None:
                  sys.exit(f"Cannot read the platform of a FairDM pinned to {source['git']}.")
              repository, ref = pin.groups()
          elif "registry" in source:
              repository, ref = "FAIR-DM/fairdm", f"v{fairdm['version']}"
          else:
              sys.exit(f"Cannot read the platform of a FairDM installed from {source}.")

          url = f"https://raw.githubusercontent.com/{repository}/{ref}/pyproject.toml"
          with urllib.request.urlopen(url, timeout=30) as response:
              project = tomllib.loads(response.read().decode())
          platform = project.get("tool", {}).get("fairdm", {}).get("platform", {})
          for key in ("image", "postgis"):
              if not re.fullmatch(r"[\w.-]+", str(platform.get(key, ""))):
                  sys.exit(
                      f"FairDM at {repository}@{ref} declares no valid [tool.fairdm.platform] "
                      f"{key}. Pin a FairDM that declares its platform."
                  )
          print(
              f"FairDM {repository}@{ref}: image {platform['image']}, "
              f"PostGIS {platform['postgis']}",
              file=sys.stderr,
          )
          print(f"image={platform['image']}")
          print(f"postgis={platform['postgis']}")
          EOF

  browser-tests:
    name: Browser tests
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:${{ needs.platform.outputs.postgis }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Keyed on the lock file, which pins the Playwright version and so the browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory)) }}

      # Chromium's system libraries are installed into the container on every run. The browser
      # itself comes from the cache when the lock file has not changed.
      - name: Run browser tests
        env:
          IMAGE: ghcr.io/fair-dm/fairdm:${{ needs.platform.outputs.image }}-dev
          PORTAL_DIR: ${{ inputs.working-directory }}
        run: |
          mkdir -p "$HOME/.cache/uv" "$HOME/.cache/ms-playwright"
          docker run --rm --network host --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/$PORTAL_DIR" \
            -v "$HOME/.cache/uv:/root/.cache/uv" \
            -v "$HOME/.cache/ms-playwright:/root/.cache/ms-playwright" \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=portal \
            "$IMAGE" \
            sh -c 'uv sync --locked && playwright install --with-deps chromium && pytest -m e2e --cov --cov-report=xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ inputs.working-directory }}/coverage.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
