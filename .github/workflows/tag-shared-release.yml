name: Tag Shared Release

# After a release pull request from Prepare Shared Release merges, creates the tag and GitHub
# Release for the newest version in CHANGELOG.md. Does nothing when that version is already
# tagged.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  tag:
    name: Tag and create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 -oE '^## \[v[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE 'v[0-9.]+' || true)"
          if [ -z "$version" ]; then
            echo "CHANGELOG.md has no released version yet. Nothing to tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists. Nothing to release."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
          echo "Created the tag and release $version at $GITHUB_SHA."
